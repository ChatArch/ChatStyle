name: Publish Package

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tool
        run: python -m pip install --upgrade pip build
      - name: Build package
        run: python -m build
      - name: Publish placeholder
        run: |
          echo "Publish workflow is intentionally scaffold-only for now."
          echo "Add trusted publishing or upload credentials when the package release flow is finalized."
