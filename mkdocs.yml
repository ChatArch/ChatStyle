site_name: ChatStyle 文档
site_description: ChatArch 可复用 CLI 交互风格和 runtime 文档
site_author: ChatArch
site_url: https://arch.gh.wzhecnu.cn/ChatStyle/

repo_name: ChatArch/ChatStyle
repo_url: https://github.com/ChatArch/ChatStyle
edit_uri: edit/master/docs/
docs_dir: docs/

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
          site_name: ChatStyle 文档
        - locale: en
          name: English
          build: true
          site_name: ChatStyle Documentation
          nav_translations:
            首页: Home
            设计草案: Design Draft
            快速开始: Quickstart
            模块板块: Modules
            交互约定: Interaction Conventions
            开发规范: Development Guide
            交互运行时: Interaction Runtime

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  alternate:
    - name: 中文
      link: /ChatStyle/
      lang: zh
    - name: English
      link: /ChatStyle/en/
      lang: en
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ChatArch/ChatStyle

nav:
  - 首页: index.md
  - 设计草案: design.md
  - 快速开始: quickstart.md
  - 模块板块: modules.md
  - 交互约定: conventions.md
  - 开发规范: development.md
  - 交互运行时: interaction-runtime.md
